<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Glow Runner - Data Migration</title>
    <style>
        body { background: #000; color: #0ff; font-family: sans-serif; text-align: center; padding: 50px; }
        #log { background: #111; padding: 20px; border: 1px solid #333; text-align: left; max-width: 600px; margin: 20px auto; font-family: monospace; overflow-y: auto; max-height: 400px; }
        .success { color: #0f0; }
        .info { color: #ff0; }
    </style>
</head>
<body>
    <h1>DATABASE MIGRATOR</h1>
    <p>Konvertiert alte User-Struktur in ID-basierte Struktur.</p>
    <button id="startBtn" style="padding: 15px 30px; cursor: pointer; background: #0ff; border: none; font-weight: bold;">MIGRATION STARTEN</button>
    <div id="log">Warte auf Start...</div>

    <script type="module">
        import { initializeApp, getDatabase, ref, get, set, remove } from './server-db.js';

        const app = initializeApp();
        const db = getDatabase(app);
        const log = document.getElementById('log');

        function addLog(msg, type = '') {
            const div = document.createElement('div');
            div.className = type;
            div.innerText = "> " + msg;
            log.appendChild(div);
            log.scrollTop = log.scrollHeight;
        }

        document.getElementById('startBtn').onclick = async () => {
            addLog("Starte Migration...", "info");
            const usersRef = ref(db, 'users');
            const snapshot = await get(usersRef);

            if (!snapshot.exists()) {
                addLog("Keine User gefunden.");
                return;
            }

            const data = snapshot.val();
            let count = 0;

            for (let key in data) {
                // Prüfen, ob der Key bereits eine ID ist (IDs starten bei dir mit RNR-)
                if (key.startsWith('RNR-')) {
                    addLog(`Überspringe ${key} (bereits neue Struktur).`);
                    continue;
                }

                const oldData = data[key];
                
                // Generiere neue ID für den alten User
                const newID = 'RNR-MIG-' + Math.random().toString(36).substr(2, 6).toUpperCase();
                
                // Baue das neue Objekt zusammen
                const newData = {
                    ...oldData,
                    username: key // Der alte Key wird jetzt zum Feld 'username'
                };

                // In neuer Struktur speichern
                await set(ref(db, 'users/' + newID), newData);
                
                addLog(`Migriert: ${key} -> ${newID}`, "success");
                count++;
            }

            addLog(`FERTIG! ${count} User migriert.`, "info");
            addLog("Du kannst die alten Namens-Einträge jetzt manuell in Firebase löschen.");
        };
    </script>
</body>
</html>
