<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glow Runner - Modi</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap');
        body { background: #000; color: white; font-family: 'Orbitron'; text-align: center; padding: 20px; }
        .mode-container { display: flex; flex-direction: column; align-items: center; gap: 20px; margin-top: 30px; }
        .mode-card { 
            width: 80%; max-width: 400px; padding: 20px; border: 2px solid #333; 
            border-radius: 15px; cursor: pointer; transition: 0.3s; background: rgba(20,20,20,0.8);
        }
        .mode-card:hover { border-color: #0ff; transform: scale(1.02); }
        .mode-card.active { border-color: #0ff; box-shadow: 0 0 20px #0ff; background: rgba(0,255,255,0.1); }
        h3 { margin: 0 0 10px 0; color: #0ff; }
        p { font-size: 0.8rem; color: #ccc; margin: 0; }
        .back { display: inline-block; margin-top: 40px; color: #888; text-decoration: none; border-bottom: 1px solid #888; }
    </style>
</head>
<body>
    <script>
        (function () {
            const isMaintenancePage = window.location.pathname.endsWith('/wartung.html');
            const isOfflinePage = window.location.pathname.endsWith('/server-offline.html');
            if (isMaintenancePage || isOfflinePage) return;

            const getApiBase = () => {
                const savedBase = localStorage.getItem('glowrunner_api_base');
                if (savedBase && savedBase.trim()) return savedBase.replace(/\/+$/, '');
                const devMode = localStorage.getItem('glowrunner_dev_mode') === 'true';
                if (devMode) return 'http://localhost:3000';
                const origin = window.location.origin;
                if (origin && origin !== 'null') return origin.replace(/\/+$/, '');
                return 'https://glow-runner-backend.onrender.com';
            };

            fetch(`${getApiBase()}/api/health`, { cache: 'no-store' })
                .then(async (response) => {
                    const data = await response.json().catch(() => ({}));
                    if (!response.ok) {
                        return;
                    }
                    if (data.status !== 'online') {
                        return;
                    }
                })
                .catch(() => {
                    window.location.href = 'server-offline.html';
                });
        })();
    </script>
    <h1>SPIELMODI</h1>
    
    <div class="mode-container">
        <div class="mode-card" id="classic" onclick="selectMode('classic')">
            <h3>CLASSIC</h3>
            <p>Flüssiges Gleiten. Der Glow folgt deinem Finger mit einer leichten Verzögerung.</p>
        </div>

        <div class="mode-card" id="blink" onclick="selectMode('blink')">
            <h3>BLINK (TELEPORT)</h3>
            <p>Echtzeit-Sprung. Nimm den Finger weg und setze ihn woanders auf, um dich sofort zu teleportieren.</p>
        </div>

    </div>

    <a href="index.html" class="back">ZURÜCK ZUM MENÜ</a>

    <script>
        // Redirect to main game - all modes managed by server
        const API_URL = "https://glow-runner-backend.onrender.com";
        const runnerID = localStorage.getItem('glow_runner_id');
        const authToken = localStorage.getItem('glow_runner_token');
        
        if (!runnerID || !authToken) {
            window.location.href = "index_beta.html";
        }

        const app = initializeApp();
        const db = getDatabase(app);
        const username = localStorage.getItem('glow_user_v4') || "Pilot";

        window.selectMode = (m) => {
            // Speichern für das Spiel
            localStorage.setItem('glow_mode', m);
            
            // Speichern in Firebase
            set(ref(db, 'users/' + username + '/currentMode'), m);

            // UI Update
            document.querySelectorAll('.mode-card').forEach(c => c.classList.remove('active'));
            document.getElementById(m).classList.add('active');
        };

        // Aktuellen Modus beim Laden anzeigen
        const savedMode = localStorage.getItem('glow_mode') || 'classic';
        document.getElementById(savedMode).classList.add('active');
    </script>
</body>
</html>
